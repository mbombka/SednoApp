services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sedno
      POSTGRES_USER: sedno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sedno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sedno -d sedno"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sedno_pg:
