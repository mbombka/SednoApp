services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: simplifier
      POSTGRES_USER: simplifier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simplifier_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplifier -d simplifier"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  simplifier_pg:
