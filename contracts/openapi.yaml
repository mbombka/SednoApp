openapi: 3.0.3
info:
  title: Sedno backend API
  version: 1.0.0
  description: >-
    Text is processed transiently. The backend stores no submitted or simplified
    text. Photos and history remain on the device. Timestamps are UTC.
servers:
  - url: https://api.example.invalid
security:
  - sessionBearer: []
paths:
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      security: []
      description: >-
        Creates a new pseudonymous guest identity and opaque credential.
        Installation ID is not authentication. Sessions with the same
        installation ID share a quota bucket. Changing it, including on
        reinstall, can bypass guest limits. Production requires a fresh
        Google Play Integrity standard token bound to the installation ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installationId, integrityToken]
              properties:
                installationId: { type: string, minLength: 1, maxLength: 200 }
                integrityToken: { type: string, description: Required in production. }
      responses:
        '200':
          description: New guest session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/auth/sessions:
    post:
      operationId: linkFirebaseIdentity
      description: >-
        Requires a guest bearer. Verifies a Firebase ID token for the configured
        project, links existing guest usage to that Firebase UID, revokes the
        guest bearer, and issues a new opaque account session. Repeated linking
        to the same account does not copy or recount usage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: New account session and current quota.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/auth/sign-out:
    post:
      operationId: signOut
      description: Revokes the current opaque session.
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Problem' }
  /v1/subscription:
    get:
      operationId: getSubscription
      description: Requires an account bearer. Refreshes stored purchases against Google Play. No client-side entitlement is trusted.
      responses:
        '200':
          description: Current subscription and the obfuscated account ID to pass to Play Billing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: verifyOrRestoreSubscription
      description: >-
        Requires an account bearer. Verifies the configured package/product and
        obfuscated account binding with subscriptionsv2.get, acknowledges eligible
        purchases on the backend, and stores an encrypted purchase token.
        Repeating a purchase token restores the same entitlement; it never adds quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseToken]
              properties:
                purchaseToken: { type: string, minLength: 1, maxLength: 8192 }
      responses:
        '200':
          description: Verified subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /notifications/google-play:
    post:
      operationId: googlePlayNotification
      security:
        - googlePushBearer: []
      description: >-
        Authenticated Pub/Sub push only. Verifies Google's RS256 OIDC signature,
        issuer, expiry, exact audience and verified service-account email. Data is
        a base64 Google Play RTDN payload for the configured package. Subscription
        and voided-purchase events trigger a fresh Google lookup; event ordering is
        not trusted. Message IDs are deduplicated transactionally after processing.
        Unknown owners and transient failures return non-2xx so Pub/Sub can retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: object
                  required: [messageId, data]
                  properties:
                    messageId: { type: string, minLength: 1, maxLength: 200 }
                    data: { type: string, format: byte }
      responses:
        '204': { description: Processed, duplicate or test notification. }
        '400': { description: Malformed payload or wrong package. }
        '401': { description: Invalid push identity. }
        '500': { description: Processing failed; retry delivery. }
        '503': { description: Billing disabled. }
  /v1/quota:
    get:
      operationId: getQuota
      responses:
        '200':
          description: Current UTC-day quota.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quota' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /v1/simplifications:
    post:
      operationId: simplifyText
      description: >-
        requestId is unique per authenticated identity. Active duplicates return
        202. Completed duplicates return 409 result_unavailable because result
        text is never persisted; the client must keep its successful response.
        A lost successful response cannot be replayed or regenerated under the
        same key. A new key starts a new request and uses quota on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimplificationRequest' }
      responses:
        '200':
          description: Result and current quota.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimplificationResponse' }
        '202':
          description: Existing request is processing.
          content:
            application/json:
              schema:
                type: object
                required: [status, quota]
                properties:
                  status: { type: string, enum: [processing] }
                  quota: { $ref: '#/components/schemas/Quota' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/simplifications/requests/{requestId}:
    get:
      operationId: getRequestStatus
      description: Ownership is checked against the bearer credential. No result text is returned.
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Operational status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestStatus' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      operationId: liveness
      security: []
      responses:
        '200': { description: Process is alive. }
  /health/ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { description: PostgreSQL is reachable. }
        '503': { description: PostgreSQL is unavailable. }
components:
  securitySchemes:
    googlePushBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Google-signed OIDC JWT for the configured Pub/Sub push service account and audience.
    sessionBearer:
      type: http
      scheme: bearer
      description: Revocable opaque guest or account credential, not a JWT.
  responses:
    Problem:
      description: RFC 7807 Problem Details with a machine-readable code.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Subscription:
      type: object
      required: [state, active, accountBinding]
      properties:
        state: { type: string, description: Google subscriptionState, none, or revoked. }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        accountBinding: { type: string, minLength: 64, maxLength: 64 }
    Problem:
      type: object
      required: [status, title, code]
      properties:
        type: { type: string }
        status: { type: integer }
        title: { type: string, description: Polish user-facing message. }
        code: { type: string }
        quota: { $ref: '#/components/schemas/Quota' }
    Account:
      type: object
      required: [id, provider]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [guest, google, email] }
    Session:
      type: object
      required: [accessToken, account, quota]
      properties:
        accessToken: { type: string }
        account: { $ref: '#/components/schemas/Account' }
        quota: { $ref: '#/components/schemas/Quota' }
    Quota:
      type: object
      required: [tier, limit, used, remaining, serverTime, resetAt]
      description: >-
        used counts successful requests on the current UTC reservation day;
        remaining excludes active reservations. Paid limit includes free usage.
      properties:
        tier: { type: string, enum: [free, subscription] }
        limit: { type: integer, enum: [2, 400] }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
        serverTime: { type: string, format: date-time }
        resetAt: { type: string, format: date-time }
    SimplificationRequest:
      type: object
      required: [requestId, text]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9_-]+$' }
        text:
          type: string
          minLength: 1
          x-maxGraphemeClusters: 4000
          description: Non-whitespace text, at most 4000 Unicode grapheme clusters.
    SimplificationResponse:
      type: object
      required: [result, quota]
      properties:
        result: { $ref: '#/components/schemas/Result' }
        quota: { $ref: '#/components/schemas/Quota' }
    Result:
      type: object
      required: [id, text, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    RequestStatus:
      type: object
      required: [requestId, status, reservationDay, quota]
      properties:
        requestId: { type: string }
        status: { type: string, enum: [processing, succeeded, failed, expired] }
        reservationDay: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        quota: { $ref: '#/components/schemas/Quota' }
