openapi: 3.0.3
info:
  title: Sedno API
  version: 0.1.0
  description: >-
    Contract for the future ASP.NET Core service. Submitted text is processed
    transiently and is never persisted by the backend. Photos and history stay
    on the device. All timestamps are UTC; character limits use Unicode
    grapheme clusters, not UTF-16 code units or Unicode scalar values.
servers:
  - url: https://api.example.invalid
    description: Replace with the production HTTPS host during deployment.
  - url: https://dev-api.example.invalid
    description: Replace with the development HTTPS host during deployment.
paths:
  /v1/guest-sessions:
    post:
      operationId: createGuestSession
      summary: Create a pseudonymous guest session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [installationId]
              properties:
                installationId:
                  type: string
                  minLength: 1
                  description: Pseudonymous installation identifier, never an anonymous identity.
                integrityToken:
                  type: string
                  description: Play Integrity token when available.
      responses:
        '200':
          description: Existing or new guest session; creating a session does not reset usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/simplifications:
    post:
      operationId: simplifyText
      summary: Simplify text without storing its content
      description: >-
        The requestId is an idempotency key scoped to the session. Replays of
        the same request return the same result without a second quota charge.
        Reusing a requestId with different text is rejected. Failed requests
        do not consume quota. The server verifies identity and subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimplificationRequest'
      responses:
        '200':
          description: Simplification and authoritative server quota state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimplificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/quota:
    get:
      operationId: getQuota
      summary: Get authoritative daily quota
      responses:
        '200':
          description: Current quota, based on server time and UTC reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/account:
    get:
      operationId: getAccount
      summary: Get current guest or signed-in account
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAccount
      summary: Delete server account data
      description: The app separately deletes its local encrypted history.
      responses:
        '204':
          description: Account data deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [accessToken, account, quota]
      properties:
        accessToken:
          type: string
          minLength: 1
        account:
          $ref: '#/components/schemas/Account'
        quota:
          $ref: '#/components/schemas/QuotaState'
    SimplificationRequest:
      type: object
      additionalProperties: false
      required: [requestId, text]
      properties:
        requestId:
          type: string
          minLength: 1
          description: Unique idempotency key generated by the client.
        text:
          type: string
          minLength: 1
          description: 1 to 4000 non-whitespace Unicode grapheme clusters.
          x-maxGraphemeClusters: 4000
    SimplificationResponse:
      type: object
      additionalProperties: false
      required: [result, quota]
      properties:
        result:
          $ref: '#/components/schemas/SimplificationResult'
        quota:
          $ref: '#/components/schemas/QuotaState'
    SimplificationResult:
      type: object
      additionalProperties: false
      required: [id, text, createdAt]
      properties:
        id:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
          description: UTC, with a Z suffix.
    Account:
      type: object
      additionalProperties: false
      required: [id, provider]
      properties:
        id:
          type: string
          minLength: 1
        provider:
          type: string
          enum: [guest, google, email]
        email:
          type: string
          format: email
          nullable: true
        displayName:
          type: string
          nullable: true
    QuotaState:
      type: object
      additionalProperties: false
      required: [tier, limit, used, remaining, serverTime, resetAt]
      description: >-
        Free limit is 2; subscription limit is 400 total per day. Remaining is
        limit minus used. Reset is the next 00:00 UTC after serverTime.
      properties:
        tier:
          type: string
          enum: [free, subscription]
        limit:
          type: integer
          enum: [2, 400]
        used:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        serverTime:
          type: string
          format: date-time
        resetAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
          description: User-facing message in Polish.
        quota:
          $ref: '#/components/schemas/QuotaState'
  responses:
    BadRequest:
      description: Malformed or invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request ID was reused with different text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: No remaining uses before the next UTC reset.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Model provider temporarily unavailable; quota is unchanged.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - bearerAuth: []
